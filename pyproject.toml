[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kahin"
version = "0.3.10"
description = "Kahin, Camoufox varsayılanlı hibrit bir CDP ansiklopedisi ve anti-detect browser otomasyon MCP'sidir. Obscura hızlı CDP işleri için opt-in'dir; görsel capability'ler Kahin içinde Camoufox'a yönlendirilir."
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2",
    "orjson>=3.10",
    "pydantic>=2.0",
    "Levenshtein>=0.26",
    "websockets>=14.0",
    "httpx>=0.28",
    "curl-cffi>=0.11",
    "Pillow>=11.0",
    # Mirage/Camoufox is the default engine and therefore a core runtime
    # dependency; a fresh install must be able to start the declared engine.
    "camoufox[geoip]>=0.1",
]

[project.scripts]
kahin = "kahin.oracle:main"

[tool.hatch.build.targets.wheel]
packages = ["kahin"]

[tool.hatch.build.targets.wheel.force-include]
"kahin/the_source/protocol.json.gz" = "kahin/the_source/protocol.json.gz"
"camoufox-harness/vendor/bin/kahin-sidecar" = "kahin/_vendor/kahin-sidecar"
"README.md" = "kahin/_docs/README.md"
"docs/juggler-ai-native.md" = "kahin/_docs/juggler-ai-native.md"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
